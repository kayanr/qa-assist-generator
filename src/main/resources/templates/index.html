<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QA Assist Generator</title>
</head>
<body>

<h1>QA Test Case Generator</h1>

<form action="/generate" method="post">

    <label>Feature Name</label><br>
    <input type="text" name="featureName" required><br><br>

    <label>Feature Type</label><br>
    <select name="featureType">
        <option th:each="type : ${featureTypes}" th:value="${type}" th:text="${type}"></option>
    </select><br><br>

    <label>Description (optional)</label><br>
    <textarea name="description" rows="3" cols="40"></textarea><br><br>

    <label>Priority</label><br>
    <select name="priority">
        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
    </select><br><br>

    <label>Test Types</label><br>
    <div th:each="type : ${testTypes}">
        <input type="checkbox" name="testTypes" th:value="${type}" th:id="${type}">
        <label th:for="${type}" th:text="${type}"></label>
    </div><br>

    <button type="submit">Generate Test Cases</button>

</form>
<hr>

<h2>Detect Feature Type from Description</h2>

<form action="/detect" method="post">
    <label>Describe the feature</label><br>
    <textarea name="text" rows="4" cols="40" placeholder="e.g. User can upload a profile picture"></textarea><br><br>
    <button type="submit">Detect Feature Type</button>
</form>

<div th:if="${detectedType != null}">
    <p>Detected feature type: <strong th:text="${detectedType}"></strong></p>
</div>

<div th:if="${detectionFailed}">
    <p>Could not detect feature type — please select manually from the form above.</p>
</div>
</body>
</html>
